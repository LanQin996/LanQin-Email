# Opt-in only: layer after docker-compose.yml. Pre-create all three private
# directories as documented; never let Compose create public plaintext roots.
services:
  lanqin-email:
    environment:
      LANQIN_BACKUP_WORKSPACE: /backups/work
      LANQIN_BACKUP_ARTIFACT_DIR: /backups/artifacts
      LANQIN_BACKUP_RESTORE_DIR: /backups/restore
    volumes:
      - type: bind
        source: ./backups/work
        target: /backups/work
        bind:
          create_host_path: false
      - type: bind
        source: ./backups/artifacts
        target: /backups/artifacts
        bind:
          create_host_path: false
      - type: bind
        source: ./backups/restore
        target: /backups/restore
        bind:
          create_host_path: false
