server {
  listen 80;
  server_name _;
  client_max_body_size 64m;

  location /api/ {
    proxy_pass http://api:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Must be cleared: the API prefers True-Client-IP when deriving the client
    # address, so a client-supplied value would override X-Real-IP below.
    proxy_set_header True-Client-IP "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /healthz {
    proxy_pass http://api:8080/healthz;
  }

  location = /livez {
    proxy_pass http://api:8080/livez;
  }

  location = /readyz {
    proxy_pass http://api:8080/readyz;
  }

  location / {
    proxy_pass http://web:80;
    proxy_set_header Host $host;
  }
}
