server {
  listen 80;

  # Security headers. CSP allows data: frame sources because mail bodies are rendered
  # in a sandboxed srcdoc iframe.
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-src 'self' data: blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  # Enable once HTTPS is terminated here:
  # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  server_name _;
  client_max_body_size 64m;

  location /api/ {
    proxy_pass http://api:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Must be cleared: the API prefers True-Client-IP when deriving the client
    # address, so a client-supplied value would override X-Real-IP below.
    proxy_set_header True-Client-IP "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /healthz {
    proxy_pass http://api:8080/healthz;
  }

  location = /livez {
    proxy_pass http://api:8080/livez;
  }

  location = /readyz {
    proxy_pass http://api:8080/readyz;
  }

  location / {
    proxy_pass http://web:80;
    proxy_set_header Host $host;
  }
}
