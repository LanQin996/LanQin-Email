name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/release.yml"
      - ".ai-reviewignore"
      - "LICENSE"
      - "deploy/.env.example"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/release.yml"
      - ".ai-reviewignore"
      - "LICENSE"
      - "deploy/.env.example"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Check web and api
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile --filter lanqin-email-web...

      - name: Check shadcn/ui usage
        run: pnpm --dir apps/web run check:shadcn

      - name: Build web
        run: pnpm --dir apps/web run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Test api
        working-directory: apps/api
        run: go test ./...

  database-contracts:
    name: Database contracts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lanqin
          POSTGRES_USER: lanqin
          POSTGRES_PASSWORD: lanqin_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lanqin -d lanqin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: lanqin
          MYSQL_USER: lanqin
          MYSQL_PASSWORD: lanqin_contract
          MYSQL_ROOT_PASSWORD: root_contract
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ulanqin -planqin_contract"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      LANQIN_TEST_POSTGRES_DSN: postgres://lanqin:lanqin_contract@127.0.0.1:5432/lanqin?sslmode=disable
      LANQIN_TEST_MYSQL_DSN: lanqin:lanqin_contract@tcp(127.0.0.1:3306)/lanqin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Test PostgreSQL and MySQL contracts
        working-directory: apps/api
        run: go test ./internal/app -run '^TestExternalDatabaseContract$' -count=1 -timeout=5m
