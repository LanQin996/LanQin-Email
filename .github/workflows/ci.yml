name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/release.yml"
      - ".ai-reviewignore"
      - "LICENSE"
      - "deploy/.env.example"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/release.yml"
      - ".ai-reviewignore"
      - "LICENSE"
      - "deploy/.env.example"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Check web and api
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile --filter lanqin-email-web...

      - name: Check shadcn/ui usage
        run: pnpm --dir apps/web run check:shadcn

      - name: Check internationalization
        run: pnpm --dir apps/web run check:i18n

      - name: Lint web
        run: pnpm --dir apps/web run lint

      - name: Check formatting
        run: pnpm --dir apps/web run format:check

      - name: Build web
        run: pnpm --dir apps/web run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Check api formatting
        working-directory: apps/api
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: Vet api
        working-directory: apps/api
        run: go vet ./...

      - name: Test api
        working-directory: apps/api
        run: go test ./...

      - name: Test root-owned maintenance host boundaries
        working-directory: apps/api
        run: sudo env "PATH=$PATH" TMPDIR=/tmp go test ./internal/backup/maintenancehost -count=1 -timeout=2m

      - name: Check deployment shell scripts
        run: >-
          go run mvdan.cc/sh/v3/cmd/shfmt@v3.10.0 -d
          deploy/postfix/configure-db.sh
          deploy/dovecot/configure-db.sh
          deploy/rspamd/sync-dkim.sh
          deploy/all-in-one/entrypoint.sh
          deploy/postgres/init-app-user.sh
          .github/scripts/generate-release-notes.sh

      - name: Check release notes generator syntax
        run: bash -n .github/scripts/generate-release-notes.sh

      - name: Render database Compose variants
        env:
          LANQIN_MYSQL_PASSWORD: mysql-app-contract
          LANQIN_MYSQL_ROOT_PASSWORD: mysql-root-contract
          LANQIN_POSTGRES_PASSWORD: postgres-app-contract
          LANQIN_POSTGRES_ADMIN_PASSWORD: postgres-admin-contract
        run: |
          cp deploy/.env.example deploy/.env
          docker compose --env-file deploy/.env -f deploy/docker-compose.yml -f deploy/docker-compose.mysql.yml config --quiet
          docker compose --env-file deploy/.env -f deploy/docker-compose.yml -f deploy/docker-compose.postgres.yml config --quiet
          docker compose --env-file deploy/.env -f deploy/docker-compose.yml -f deploy/docker-compose.backup.yml config --quiet
          docker compose --env-file deploy/.env -f deploy/docker-compose.yml -f deploy/docker-compose.mysql.yml -f deploy/docker-compose.backup.yml config --quiet
          docker compose --env-file deploy/.env -f deploy/docker-compose.yml -f deploy/docker-compose.postgres.yml -f deploy/docker-compose.backup.yml config --quiet
          docker compose --env-file deploy/.env -f deploy/docker-compose.stack.yml -f deploy/docker-compose.stack.backup.yml config --quiet

  database-contracts:
    name: Database contracts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lanqin
          POSTGRES_USER: lanqin
          POSTGRES_PASSWORD: lanqin_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lanqin -d lanqin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: lanqin
          MYSQL_USER: lanqin
          MYSQL_PASSWORD: lanqin_contract
          MYSQL_ROOT_PASSWORD: root_contract
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ulanqin -planqin_contract"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      LANQIN_TEST_POSTGRES_DSN: postgres://lanqin:lanqin_contract@127.0.0.1:5432/lanqin?sslmode=disable
      LANQIN_TEST_MYSQL_DSN: lanqin:lanqin_contract@tcp(127.0.0.1:3306)/lanqin
      LANQIN_TEST_NATIVE_POSTGRES_SOURCE_DSN: postgres://lanqin:lanqin_contract@127.0.0.1:5432/lanqin_native_source?sslmode=disable
      LANQIN_TEST_NATIVE_POSTGRES_TARGET_DSN: postgres://lanqin:lanqin_contract@127.0.0.1:5432/lanqin_native_target?sslmode=disable
      LANQIN_TEST_NATIVE_POSTGRES_CLI_DSN: postgres://lanqin:lanqin_contract@127.0.0.1:5432/lanqin_native_cli?sslmode=disable
      LANQIN_TEST_NATIVE_POSTGRES_BAD_DSN: postgres://lanqin:lanqin_contract@127.0.0.1:5432/lanqin_native_bad?sslmode=disable
      LANQIN_TEST_NATIVE_POSTGRES_WEB_DSN: postgres://lanqin:lanqin_contract@127.0.0.1:5432/lanqin_native_web?sslmode=disable
      LANQIN_TEST_NATIVE_POSTGRES_HOST_DSN: postgres://lanqin:lanqin_contract@127.0.0.1:5432/lanqin_native_host?sslmode=disable
      LANQIN_TEST_NATIVE_MYSQL_SOURCE_DSN: lanqin:lanqin_contract@tcp(127.0.0.1:3306)/lanqin_native_source
      LANQIN_TEST_NATIVE_MYSQL_TARGET_DSN: lanqin:lanqin_contract@tcp(127.0.0.1:3306)/lanqin_native_target
      LANQIN_TEST_NATIVE_MYSQL_CLI_DSN: lanqin:lanqin_contract@tcp(127.0.0.1:3306)/lanqin_native_cli
      LANQIN_TEST_NATIVE_MYSQL_BAD_DSN: lanqin:lanqin_contract@tcp(127.0.0.1:3306)/lanqin_native_bad
      LANQIN_TEST_NATIVE_MYSQL_WEB_DSN: lanqin:lanqin_contract@tcp(127.0.0.1:3306)/lanqin_native_web
      LANQIN_TEST_NATIVE_MYSQL_HOST_DSN: lanqin:lanqin_contract@tcp(127.0.0.1:3306)/lanqin_native_host
      LANQIN_TEST_BACKUP_CLI: ${{ github.workspace }}/tmp/lanqin-backup-native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Prepare isolated native backup databases
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          for database in lanqin_native_source lanqin_native_target lanqin_native_cli lanqin_native_bad lanqin_native_web lanqin_native_host; do
            docker exec -e PGPASSWORD=lanqin_contract "$POSTGRES_CONTAINER" createdb -h 127.0.0.1 -U lanqin "$database"
          done
          docker exec -e MYSQL_PWD=root_contract "$MYSQL_CONTAINER" mysql --no-defaults -uroot -e "CREATE DATABASE lanqin_native_source CHARACTER SET utf8mb4 COLLATE utf8mb4_bin; CREATE DATABASE lanqin_native_target CHARACTER SET utf8mb4 COLLATE utf8mb4_bin; CREATE DATABASE lanqin_native_cli CHARACTER SET utf8mb4 COLLATE utf8mb4_bin; CREATE DATABASE lanqin_native_bad CHARACTER SET utf8mb4 COLLATE utf8mb4_bin; CREATE DATABASE lanqin_native_web CHARACTER SET utf8mb4 COLLATE utf8mb4_bin; GRANT ALL ON lanqin_native_source.* TO 'lanqin'@'%'; GRANT ALL ON lanqin_native_target.* TO 'lanqin'@'%'; GRANT ALL ON lanqin_native_cli.* TO 'lanqin'@'%'; GRANT ALL ON lanqin_native_bad.* TO 'lanqin'@'%'; GRANT ALL ON lanqin_native_web.* TO 'lanqin'@'%';"

          docker exec -e MYSQL_PWD=root_contract "$MYSQL_CONTAINER" mysql --no-defaults -uroot -e "CREATE DATABASE lanqin_native_host CHARACTER SET utf8mb4 COLLATE utf8mb4_bin; GRANT ALL ON lanqin_native_host.* TO 'lanqin'@'%';"

      - name: Build native backup CLI for roundtrip tests
        working-directory: apps/api
        run: |
          mkdir -p "$(dirname "$LANQIN_TEST_BACKUP_CLI")"
          go build -o "$LANQIN_TEST_BACKUP_CLI" ./cmd/backup

      - name: Test PostgreSQL and MySQL contracts and native backup roundtrips
        working-directory: apps/api
        run: go test ./internal/app -run '^TestExternalDatabaseContract$|^TestNativeDatabaseBackupRestoreContract$' -count=1 -timeout=5m
